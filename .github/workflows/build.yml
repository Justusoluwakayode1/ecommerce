name: Ecommerce

on: 
  push: 
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - name: checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirement.txt
